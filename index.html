<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM札整理ゲーム</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
    crossorigin="anonymous"></script>

  <style>
    body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ecfdf5,#f8fafc);color:#333;text-align:center}
    header{padding:25px 10px;background:#047857;color:white}
    h1{margin:0;font-size:30px}
    .note{font-size:14px;margin-top:10px}
    .ad-area{max-width:900px;margin:20px auto;padding:10px;background:white;border-radius:12px}
    .container{max-width:850px;margin:25px auto;padding:25px;background:white;border-radius:20px;box-shadow:0 0 25px rgba(0,0,0,.15)}
    .icon{font-size:70px;margin:15px 0}
    .story{font-size:20px;line-height:1.7;background:#ecfdf5;border-radius:16px;padding:18px;margin:15px 0}
    .question{font-size:22px;font-weight:bold;line-height:1.7;margin:25px 0}
    .choices button{display:block;width:100%;margin:12px 0;padding:15px;font-size:17px;border:none;border-radius:12px;cursor:pointer;background:#bbf7d0;color:#333;transition:.2s}
    .choices button:hover{background:#86efac;transform:scale(1.02)}
    .choices button.correct{background:#22c55e;color:white}
    .choices button.wrong{background:#fecaca}
    .choices button:disabled{cursor:not-allowed;opacity:.85}
    .explanation{margin-top:15px;font-size:15px;color:#555;min-height:45px;line-height:1.7}
    .progress{margin-top:15px;color:#777}
    .result{display:none;line-height:1.8}
    .result-title{font-size:30px;color:#047857;margin-bottom:15px;font-weight:bold}
    .score-box{margin-top:20px;font-size:18px;color:#047857;font-weight:bold}
    .restart{margin-top:25px;padding:14px 30px;font-size:17px;border:none;border-radius:999px;background:#047857;color:white;cursor:pointer}
  </style>
</head>
<body>

<header>
  <h1>ATM札整理ゲーム</h1>
  <div class="note">お札の枚数を考えて、正しく整理しよう！</div>
</header>

<div class="ad-area">
  <!-- チェス -->
  <ins class="adsbygoogle"
    style="display:block"
    data-ad-client="ca-pub-8398161859137802"
    data-ad-slot="5599163841"
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

<div class="container">
  <div id="quiz">
    <div class="icon">
  <svg width="180" height="180" viewBox="0 0 200 200">
    
    <!-- ATM本体 -->
    <rect x="35" y="20" width="130" height="160" rx="12" fill="#2d3748"/>

    <!-- 画面 -->
    <rect x="55" y="40" width="90" height="45" rx="6" fill="#7dd3fc"/>

    <!-- 画面文字 -->
    <text x="100" y="68"
      text-anchor="middle"
      font-size="16"
      fill="#0f172a"
      font-weight="bold">
      ATM
    </text>

    <!-- カード口 -->
    <rect x="65" y="100" width="70" height="8" rx="4" fill="#111827"/>

    <!-- お札口 -->
    <rect x="60" y="125" width="80" height="16" rx="4" fill="#1f2937"/>

    <!-- お札 -->
    <rect x="75" y="138" width="50" height="18" rx="3" fill="#86efac"/>
    <text x="100" y="151"
      text-anchor="middle"
      font-size="10"
      fill="#166534"
      font-weight="bold">
      ¥10000
    </text>

    <!-- ボタン -->
    <circle cx="70" cy="170" r="6" fill="#60a5fa"/>
    <circle cx="100" cy="170" r="6" fill="#facc15"/>
    <circle cx="130" cy="170" r="6" fill="#f87171"/>

  </svg>
</div>
    <div class="story" id="story"></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="explanation" id="explanation"></div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="result" id="result">
    <div class="result-title" id="resultTitle"></div>
    <div id="resultText"></div>
    <div class="score-box" id="scoreBox"></div>
    <button class="restart" onclick="restartQuiz()">もう一度遊ぶ</button>
  </div>
</div>

<script>
const questions = [
  {
    story:"ATMに1万円札が3枚、千円札が5枚あります。",
    q:"合計金額はいくら？",
    choices:["30,500円","35,000円","38,000円","53,000円"],
    answer:1,
    exp:"1万円札3枚で30,000円、千円札5枚で5,000円。合計35,000円です。"
  },
  {
    story:"お客さんが12,000円を引き出します。",
    q:"お札の組み合わせとして正しいのは？",
    choices:["1万円札1枚＋千円札2枚","1万円札2枚＋千円札2枚","5千円札1枚＋千円札2枚","千円札20枚"],
    answer:0,
    exp:"10,000円＋2,000円＝12,000円です。"
  },
  {
    story:"ATMに千円札が10枚あります。",
    q:"合計金額はいくら？",
    choices:["1,000円","5,000円","10,000円","100,000円"],
    answer:2,
    exp:"千円札10枚は10,000円です。"
  },
  {
    story:"1万円札2枚、5千円札1枚、千円札3枚があります。",
    q:"合計金額はいくら？",
    choices:["23,000円","25,000円","28,000円","30,000円"],
    answer:2,
    exp:"20,000円＋5,000円＋3,000円＝28,000円です。"
  },
  {
    story:"ATMから9,000円を出したいです。",
    q:"正しい組み合わせは？",
    choices:["5千円札1枚＋千円札4枚","1万円札1枚","5千円札2枚","千円札8枚"],
    answer:0,
    exp:"5,000円＋4,000円＝9,000円です。"
  },
  {
    story:"1万円札5枚を補充しました。",
    q:"補充金額はいくら？",
    choices:["5,000円","10,000円","50,000円","500,000円"],
    answer:2,
    exp:"10,000円×5枚＝50,000円です。"
  },
  {
    story:"5千円札4枚があります。",
    q:"合計金額はいくら？",
    choices:["10,000円","15,000円","20,000円","40,000円"],
    answer:2,
    exp:"5,000円×4枚＝20,000円です。"
  },
  {
    story:"お客さんが27,000円を引き出します。",
    q:"お札の枚数が少ない組み合わせは？",
    choices:["1万円札2枚＋5千円札1枚＋千円札2枚","千円札27枚","5千円札5枚＋千円札2枚","1万円札1枚＋千円札17枚"],
    answer:0,
    exp:"20,000円＋5,000円＋2,000円＝27,000円で、枚数も少なめです。"
  },
  {
    story:"ATMに1万円札10枚、5千円札2枚、千円札20枚があります。",
    q:"合計金額はいくら？",
    choices:["120,000円","130,000円","140,000円","150,000円"],
    answer:1,
    exp:"100,000円＋10,000円＋20,000円＝130,000円です。"
  },
  {
    story:"18,000円を作ります。",
    q:"正しい組み合わせは？",
    choices:["1万円札1枚＋5千円札1枚＋千円札3枚","1万円札2枚","5千円札2枚＋千円札6枚","千円札10枚"],
    answer:0,
    exp:"10,000円＋5,000円＋3,000円＝18,000円です。"
  },
  {
    story:"ATMから千円札が7枚出ました。",
    q:"金額はいくら？",
    choices:["700円","7,000円","17,000円","70,000円"],
    answer:1,
    exp:"千円札7枚は7,000円です。"
  },
  {
    story:"お客さんが50,000円を引き出します。",
    q:"最も枚数が少ない組み合わせは？",
    choices:["1万円札5枚","5千円札10枚","千円札50枚","1万円札4枚＋千円札10枚"],
    answer:0,
    exp:"1万円札5枚なら5枚で済みます。"
  },
  {
    story:"1万円札1枚、5千円札2枚、千円札5枚があります。",
    q:"合計金額はいくら？",
    choices:["20,000円","25,000円","30,000円","35,000円"],
    answer:1,
    exp:"10,000円＋10,000円＋5,000円＝25,000円です。"
  },
  {
    story:"13,000円を出したいです。",
    q:"正しい組み合わせは？",
    choices:["1万円札1枚＋千円札3枚","5千円札3枚","1万円札2枚＋千円札3枚","千円札12枚"],
    answer:0,
    exp:"10,000円＋3,000円＝13,000円です。"
  },
  {
    story:"5千円札1枚と千円札9枚があります。",
    q:"合計金額はいくら？",
    choices:["9,000円","12,000円","14,000円","19,000円"],
    answer:2,
    exp:"5,000円＋9,000円＝14,000円です。"
  },
  {
    story:"ATMの千円札が残り2枚です。",
    q:"千円札だけで出せる最大金額は？",
    choices:["1,000円","2,000円","5,000円","10,000円"],
    answer:1,
    exp:"千円札2枚なので最大2,000円です。"
  },
  {
    story:"36,000円を出します。",
    q:"正しい組み合わせは？",
    choices:["1万円札3枚＋5千円札1枚＋千円札1枚","1万円札2枚＋5千円札2枚＋千円札6枚","1万円札4枚","5千円札7枚"],
    answer:0,
    exp:"30,000円＋5,000円＋1,000円＝36,000円です。"
  },
  {
    story:"1万円札8枚があります。",
    q:"合計金額はいくら？",
    choices:["8,000円","18,000円","80,000円","800,000円"],
    answer:2,
    exp:"10,000円×8枚＝80,000円です。"
  },
  {
    story:"24,000円を出したいです。",
    q:"正しい組み合わせは？",
    choices:["1万円札2枚＋千円札4枚","1万円札1枚＋5千円札1枚＋千円札4枚","5千円札4枚","千円札20枚"],
    answer:0,
    exp:"20,000円＋4,000円＝24,000円です。"
  },
  {
    story:"5千円札3枚、千円札6枚があります。",
    q:"合計金額はいくら？",
    choices:["15,000円","18,000円","21,000円","26,000円"],
    answer:2,
    exp:"15,000円＋6,000円＝21,000円です。"
  },
  {
    story:"ATMに1万円札が4枚、千円札が12枚あります。",
    q:"合計金額はいくら？",
    choices:["42,000円","48,000円","52,000円","120,000円"],
    answer:2,
    exp:"40,000円＋12,000円＝52,000円です。"
  },
  {
    story:"17,000円を作ります。",
    q:"正しい組み合わせは？",
    choices:["1万円札1枚＋5千円札1枚＋千円札2枚","1万円札2枚＋千円札7枚","5千円札2枚＋千円札5枚","千円札16枚"],
    answer:0,
    exp:"10,000円＋5,000円＋2,000円＝17,000円です。"
  },
  {
    story:"お客さんが1万円を千円札でほしいと言っています。",
    q:"必要な千円札は何枚？",
    choices:["5枚","10枚","20枚","100枚"],
    answer:1,
    exp:"1,000円×10枚＝10,000円です。"
  },
  {
    story:"お客さんが2万円を5千円札だけでほしいと言っています。",
    q:"必要な5千円札は何枚？",
    choices:["2枚","3枚","4枚","5枚"],
    answer:2,
    exp:"5,000円×4枚＝20,000円です。"
  },
  {
    story:"1万円札2枚と5千円札3枚を補充しました。",
    q:"補充金額はいくら？",
    choices:["25,000円","30,000円","35,000円","40,000円"],
    answer:2,
    exp:"20,000円＋15,000円＝35,000円です。"
  },
  {
    story:"千円札15枚を5千円札に両替すると、5千円札は何枚分？",
    q:"正しい答えは？",
    choices:["1枚","2枚","3枚","5枚"],
    answer:2,
    exp:"15,000円なので、5,000円札3枚分です。"
  },
  {
    story:"1万円札1枚を千円札に両替します。",
    q:"千円札は何枚になる？",
    choices:["5枚","10枚","15枚","20枚"],
    answer:1,
    exp:"10,000円÷1,000円＝10枚です。"
  },
  {
    story:"ATMから43,000円を出します。",
    q:"正しい組み合わせは？",
    choices:["1万円札4枚＋千円札3枚","1万円札3枚＋5千円札3枚","5千円札8枚","千円札40枚"],
    answer:0,
    exp:"40,000円＋3,000円＝43,000円です。"
  },
  {
    story:"5千円札2枚を千円札に両替します。",
    q:"千円札は何枚になる？",
    choices:["5枚","8枚","10枚","12枚"],
    answer:2,
    exp:"5千円札2枚は10,000円なので、千円札10枚です。"
  },
  {
    story:"ATMに1万円札6枚、5千円札4枚、千円札8枚があります。",
    q:"合計金額はいくら？",
    choices:["78,000円","88,000円","98,000円","108,000円"],
    answer:1,
    exp:"60,000円＋20,000円＋8,000円＝88,000円です。"
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const storyEl = document.getElementById("story");
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const explanationEl = document.getElementById("explanation");
const progressEl = document.getElementById("progress");
const quizEl = document.getElementById("quiz");
const resultEl = document.getElementById("result");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");
const scoreBox = document.getElementById("scoreBox");

function showQuestion(){
  answered = false;
  const q = questions[currentQuestion];

  storyEl.textContent = q.story;
  questionEl.textContent = q.q;
  choicesEl.innerHTML = "";
  explanationEl.textContent = "";

  q.choices.forEach((choice,index)=>{
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.onclick = () => selectAnswer(index, btn);
    choicesEl.appendChild(btn);
  });

  progressEl.textContent = `${currentQuestion + 1} / ${questions.length}`;
}

function selectAnswer(index, button){
  if(answered) return;
  answered = true;

  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll(".choices button");
  buttons.forEach(btn => btn.disabled = true);

  if(index === q.answer){
    score++;
    button.classList.add("correct");
    explanationEl.textContent = "正解！ " + q.exp;
  }else{
    button.classList.add("wrong");
    buttons[q.answer].classList.add("correct");
    explanationEl.textContent = "不正解。 " + q.exp;
  }

  setTimeout(()=>{
    currentQuestion++;
    if(currentQuestion < questions.length){
      showQuestion();
    }else{
      showResult();
    }
  },1200);
}

function showResult(){
  quizEl.style.display = "none";
  resultEl.style.display = "block";

  const rate = Math.round((score / questions.length) * 100);

  if(rate >= 85){
    resultTitle.textContent = "ATM札整理マスター！";
    resultText.textContent = "お札の計算と整理がかなり得意です。金額チェックもスムーズにできます。";
  }else if(rate >= 60){
    resultTitle.textContent = "お札整理上級者！";
    resultText.textContent = "基本的な金額計算はバッチリです。枚数が増えても落ち着いて計算できています。";
  }else if(rate >= 35){
    resultTitle.textContent = "札整理トレーニング中！";
    resultText.textContent = "少しずつ慣れてきています。1万円札・5千円札・千円札を分けて計算するのがコツです。";
  }else{
    resultTitle.textContent = "お札混乱タイプ！";
    resultText.textContent = "まずは1万円札＝10,000円、5千円札＝5,000円、千円札＝1,000円を分けて考えましょう。";
  }

  scoreBox.textContent = `正解数：${score} / ${questions.length}　正解率：${rate}%`;
}

function restartQuiz(){
  currentQuestion = 0;
  score = 0;
  quizEl.style.display = "block";
  resultEl.style.display = "none";
  showQuestion();
}

showQuestion();
</script>

</body>
</html>
