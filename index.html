<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM札整理ゲーム</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js?client=ca-pub-8398161859137802"
    crossorigin="anonymous"></script>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#ecfdf5,#f8fafc);
      color:#333;
      text-align:center;
    }

    header{
      padding:25px 10px;
      background:#047857;
      color:white;
    }

    h1{
      margin:0;
      font-size:30px;
    }

    .note{
      font-size:14px;
      margin-top:10px;
    }

    .ad-area{
      max-width:900px;
      margin:20px auto;
      padding:10px;
      background:white;
      border-radius:12px;
    }

    .container{
      max-width:850px;
      margin:25px auto;
      padding:25px;
      background:white;
      border-radius:20px;
      box-shadow:0 0 25px rgba(0,0,0,.15);
    }

    .icon{
      margin:10px 0 20px;
    }

    .story{
      font-size:20px;
      line-height:1.7;
      background:#ecfdf5;
      border-radius:16px;
      padding:18px;
      margin:15px 0;
    }

    .question{
      font-size:22px;
      font-weight:bold;
      line-height:1.7;
      margin:25px 0;
    }

    .choices button{
      display:block;
      width:100%;
      margin:12px 0;
      padding:15px;
      font-size:17px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      background:#bbf7d0;
      color:#333;
      transition:.2s;
    }

    .choices button:hover{
      background:#86efac;
      transform:scale(1.02);
    }

    .choices button.correct{
      background:#22c55e;
      color:white;
    }

    .choices button.wrong{
      background:#fecaca;
    }

    .choices button:disabled{
      cursor:not-allowed;
      opacity:.85;
    }

    .explanation{
      margin-top:15px;
      font-size:15px;
      color:#555;
      min-height:45px;
      line-height:1.7;
    }

    .progress{
      margin-top:15px;
      color:#777;
    }

    .result{
      display:none;
      line-height:1.8;
    }

    .result-title{
      font-size:30px;
      color:#047857;
      margin-bottom:15px;
      font-weight:bold;
    }

    .score-box{
      margin-top:20px;
      font-size:18px;
      color:#047857;
      font-weight:bold;
    }

    .restart{
      margin-top:25px;
      padding:14px 30px;
      font-size:17px;
      border:none;
      border-radius:999px;
      background:#047857;
      color:white;
      cursor:pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>ATM札整理ゲーム</h1>
  <div class="note">お札の枚数を考えて、正しく整理しよう！</div>
</header>

<div class="ad-area">

  <ins class="adsbygoogle"
    style="display:block"
    data-ad-client="ca-pub-8398161859137802"
    data-ad-slot="5599163841"
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

</div>

<div class="container">

  <!-- ATMイラスト -->
  <div class="icon">

  <svg width="240" height="240" viewBox="0 0 240 240">

    <!-- 外枠 -->
    <rect x="40" y="15" width="160" height="210" rx="12" fill="#d1d5db"/>

    <!-- 上部 -->
    <rect x="40" y="15" width="160" height="35" rx="12" fill="#2563eb"/>

    <!-- BANK文字 -->
    <text x="120" y="38"
          text-anchor="middle"
          font-size="20"
          fill="white"
          font-weight="bold">
      BANK ATM
    </text>

    <!-- 画面 -->
    <rect x="60" y="65" width="120" height="60" rx="6" fill="#93c5fd"/>

    <!-- 画面内 -->
    <rect x="72" y="78" width="45" height="10" rx="2" fill="#1e3a8a"/>
    <rect x="72" y="95" width="75" height="8" rx="2" fill="#60a5fa"/>
    <rect x="72" y="108" width="55" height="8" rx="2" fill="#60a5fa"/>

    <!-- テンキー -->
    <g>
      <rect x="65" y="140" width="20" height="20" rx="3" fill="#374151"/>
      <rect x="92" y="140" width="20" height="20" rx="3" fill="#374151"/>
      <rect x="119" y="140" width="20" height="20" rx="3" fill="#374151"/>

      <rect x="65" y="167" width="20" height="20" rx="3" fill="#374151"/>
      <rect x="92" y="167" width="20" height="20" rx="3" fill="#374151"/>
      <rect x="119" y="167" width="20" height="20" rx="3" fill="#374151"/>

      <rect x="65" y="194" width="20" height="20" rx="3" fill="#374151"/>
      <rect x="92" y="194" width="20" height="20" rx="3" fill="#374151"/>
      <rect x="119" y="194" width="20" height="20" rx="3" fill="#374151"/>
    </g>

    <!-- カード挿入口 -->
    <rect x="150" y="145" width="30" height="6" rx="2" fill="#111827"/>

    <!-- 紙幣口 -->
    <rect x="145" y="180" width="40" height="14" rx="3" fill="#111827"/>

    <!-- 紙幣 -->
    <rect x="150" y="192" width="30" height="12" rx="2" fill="#86efac"/>

    <!-- サイド影 -->
    <rect x="190" y="25" width="8" height="190" rx="4" fill="#9ca3af"/>

  </svg>

  </div>

  <div id="quiz">

    <div class="story" id="story"></div>

    <div class="question" id="question"></div>

    <div class="choices" id="choices"></div>

    <div class="explanation" id="explanation"></div>

    <div class="progress" id="progress"></div>

  </div>

  <div class="result" id="result">

    <div class="result-title" id="resultTitle"></div>

    <div id="resultText"></div>

    <div class="score-box" id="scoreBox"></div>

    <button class="restart" onclick="restartQuiz()">
      もう一度遊ぶ
    </button>

  </div>

</div>

<script>

const questions = [

{
story:"ATMに1万円札が3枚、千円札が5枚あります。",
q:"合計金額はいくら？",
choices:["30,500円","35,000円","38,000円","53,000円"],
answer:1,
exp:"1万円札3枚で30,000円、千円札5枚で5,000円。合計35,000円です。"
},

{
story:"お客さんが12,000円を引き出します。",
q:"お札の組み合わせとして正しいのは？",
choices:["1万円札1枚＋千円札2枚","1万円札2枚＋千円札2枚","5千円札1枚＋千円札2枚","千円札20枚"],
answer:0,
exp:"10,000円＋2,000円＝12,000円です。"
},

{
story:"1万円札2枚、5千円札1枚、千円札3枚があります。",
q:"合計金額はいくら？",
choices:["23,000円","25,000円","28,000円","30,000円"],
answer:2,
exp:"20,000円＋5,000円＋3,000円＝28,000円です。"
},

{
story:"ATMから9,000円を出したいです。",
q:"正しい組み合わせは？",
choices:["5千円札1枚＋千円札4枚","1万円札1枚","5千円札2枚","千円札8枚"],
answer:0,
exp:"5,000円＋4,000円＝9,000円です。"
},

{
story:"5千円札4枚があります。",
q:"合計金額はいくら？",
choices:["10,000円","15,000円","20,000円","40,000円"],
answer:2,
exp:"5,000円×4枚＝20,000円です。"
}

];

let currentQuestion = 0;
let score = 0;
let answered = false;

const storyEl = document.getElementById("story");
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const explanationEl = document.getElementById("explanation");
const progressEl = document.getElementById("progress");
const quizEl = document.getElementById("quiz");
const resultEl = document.getElementById("result");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");
const scoreBox = document.getElementById("scoreBox");

function showQuestion(){

  answered = false;

  const q = questions[currentQuestion];

  storyEl.textContent = q.story;
  questionEl.textContent = q.q;

  choicesEl.innerHTML = "";
  explanationEl.textContent = "";

  q.choices.forEach((choice,index)=>{

    const btn = document.createElement("button");

    btn.textContent = choice;

    btn.onclick = () => selectAnswer(index, btn);

    choicesEl.appendChild(btn);

  });

  progressEl.textContent =
    `${currentQuestion + 1} / ${questions.length}`;
}

function selectAnswer(index, button){

  if(answered) return;

  answered = true;

  const q = questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".choices button");

  buttons.forEach(btn => btn.disabled = true);

  if(index === q.answer){

    score++;

    button.classList.add("correct");

    explanationEl.textContent =
      "正解！ " + q.exp;

  }else{

    button.classList.add("wrong");

    buttons[q.answer].classList.add("correct");

    explanationEl.textContent =
      "不正解。 " + q.exp;
  }

  setTimeout(()=>{

    currentQuestion++;

    if(currentQuestion < questions.length){

      showQuestion();

    }else{

      showResult();

    }

  },1200);
}

function showResult(){

  quizEl.style.display = "none";

  resultEl.style.display = "block";

  const rate =
    Math.round((score / questions.length) * 100);

  if(rate >= 80){

    resultTitle.textContent =
      "ATM整理マスター！";

    resultText.textContent =
      "お札計算がかなり得意です！";

  }else if(rate >= 50){

    resultTitle.textContent =
      "ATM整理上級者！";

    resultText.textContent =
      "基本的な計算はしっかりできています！";

  }else{

    resultTitle.textContent =
      "ATM修行中！";

    resultText.textContent =
      "1万円・5千円・千円を分けて考えると分かりやすいです！";
  }

  scoreBox.textContent =
    `正解数：${score} / ${questions.length}　正解率：${rate}%`;
}

function restartQuiz(){

  currentQuestion = 0;

  score = 0;

  quizEl.style.display = "block";

  resultEl.style.display = "none";

  showQuestion();
}

showQuestion();

</script>

</body>
</html>
